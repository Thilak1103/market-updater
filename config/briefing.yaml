# ── Email inbox (newsletters, incl. FT, Bloomberg, paid Substacks) ───
# A dedicated mailbox; subscribe newsletters to it or forward them.
# Mail from `subscriber_senders` is marked as subscriber content: the briefing paraphrases it and never quotes it.
email_inbox:
  imap_host_env: IMAP_HOST
  user_env: IMAP_USER
  password_env: IMAP_APP_PASSWORD     # an app-specific password, never your main one
  folder: INBOX
  subscriber_senders: ["ft.com", "bloomberg", "substack.com"]

# ── Listening ─────────────────────────────────────────────────────────
ingest:
  audio_minutes_per_run: 200      # Groq free tier; speech is sped up 1.4x first, so this covers ~280 real minutes
  # Daily news recaps mostly repeat the price moves: transcribed last, only if budget is left.
  recap_podcasts: ["Bloomberg Daybreak: Europe Edition", "FT News Briefing", "The Markets", "Bloomberg Tech",
                   "Thoughts on the Market"]
