substack_discovery:
  run: weekly                      # Sunday night; results in Friday's page too
  methods:
    recommendations: true          # each subscription's public "recommends" list
    citations: true                # links inside posts already received
    topic_search: true             # recent posts on watch-list names and live debates
  max_requests_per_week: 400
  candidates_per_week: 100
  scoring_model: claude-haiku-5-5
  score_on: [relevance, originality, against_consensus, free_full_text]
  daily_new_voice_min_score: 0.8   # high-scoring free posts can enter the briefing as "new voice"
  weekly_shortlist: 5              # Notion Discovery database: Track / Ignore
  public_pages_only: true
  short_sellers:   # public research pages; checked daily
    - {name: "Muddy Waters", url: "https://muddywatersresearch.com/research/"}   # unverified
    - {name: "Spruce Point", url: "https://www.sprucepointcap.com/research"}   # unverified
    - {name: "Kerrisdale Capital", url: "https://www.kerrisdalecap.com/blog/"}   # unverified
    - {name: "Culper Research", url: "https://culperresearch.com/"}   # unverified
    - {name: "Wolfpack Research", url: "https://wolfpackresearch.com/"}   # unverified
    - {name: "Grizzly Research", url: "https://grizzlyreports.com/"}   # unverified
    - {name: "Fuzzy Panda Research", url: "https://fuzzypandaresearch.com/"}   # unverified
    - {name: "Viceroy Research", url: "https://viceroyresearch.org/"}   # unverified
  bluesky:         # profile RSS: https://bsky.app/profile/<handle>/rss
    handles: []    # add handles for people on your list who post there

