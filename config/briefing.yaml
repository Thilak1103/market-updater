# Market Updater — sectors and sources config (draft, 18 Nov 2026)
#
# Edit this file to change coverage; no code changes needed.
#
# Conventions
#   verify: true  -> URL or ticker not yet checked. The setup script
#                    (scripts/check_sources.py) tests it before the first run
#                    and writes the working feed URL back here.
#   url: null     -> no known feed yet; `find` says where to look.
#   lean          -> the voice's usual stance (bull / bear / mixed). Used to
#                    balance the "Where views diverge" section, not to filter.
#   contrarian    -> true for people with a public record of calls against
#                    consensus (not the same as a record of being right).
#   priority      -> true = covered every time they publish, on any channel.
#   interested    -> true when the voice's employer profits from their view.

schedule:
  timezone: Europe/London
  weekdays_only: true
  collect_at: "05:00"
  market_snapshot_at: "06:15"
  publish_by: "06:45"
  health_check_at: "07:00"
  deep_dive_days: [Tue, Wed, Thu, Fri]   # on the previous day's busiest Elsewhere sector

delivery:
  telegram_alerts: failures_only

notion:
  # Data source IDs of the databases under the "Market Updater" Notion page.
  # The server's Notion integration must be connected to that page.
  data_sources:
    briefings: 41c25b17-0278-8105-9471-000b2be4d9ce
    views: 41c25b17-0278-8158-9eda-000b7615c523
    ideas: 41c25b17-0278-816a-adf8-000b20264ea2
    inbox: 41c25b17-0278-8114-8ce8-000be0627751
    discovery: 41c25b17-0278-810e-8d56-000ba874dd62
    sectors: 41c25b17-0278-81dd-93c4-000bf16032d4
    sources: 41c25b17-0278-81ee-b12f-000b110aec39
    debates: 41c25b17-0278-81b2-b803-000b057ec87d
    settings: 41c25b17-0278-81a4-9827-000b65e53bda
    reading: 41e25b17-0278-81b3-a773-000becdfc655
  pages:
    home: 41c25b17027881f69fa2f1ff7cbc8c1b          # the Market Updater page (the "Today's briefing" box)
    dashboard: 41e25b170278816ca585e60fd34308b4     # Trade idea dashboard

models:
  # Claude API on the Max plan's $100/month credit (link a Console org in
  # claude.ai Settings > Billing). Groq free tier is the fallback.
  extract: {provider: anthropic, model: claude-haiku-5-5, fallback: groq}
  write: {provider: anthropic, model: claude-sonnet-5-5, fallback: groq}
  earnings_review: {provider: anthropic, model: claude-sonnet-5-5, fallback: groq}
  trade_ideas: {provider: anthropic, model: claude-opus-5-5, fallback: skip}
  transcription: {provider: groq, model: whisper-large-v3-turbo}
  credit_guard:
    monthly_credit_usd: 100
    move_extraction_to_fallback_at_usd: 80

settings_source: notion        # Notion settings databases are the live copy;
                               # this file is the seed and the nightly backup.

following:
  stocks: [ANT]        # Notion Settings row "Stocks I follow": a section per name, with news and views

trade_ideas:
  per_day: [3, 4]
  min_against_crowded_consensus: 1
  max_per_sector: 2
  legs_from: [watchlists, sector_proxies]
  min_pair_correlation_1y: 0.6        # pairs below this are not pitched...
  fallback_min_correlation_1y: 0.5   # ...unless fewer than 3 ideas pass (conviction is then capped at Medium)
  hedge_ratio: beta_1y_daily
  spread_zscore_window_days: 60
  stop_spread_vol_multiple: 1.5
  target_spread_vol_multiple: 2.0    # target when the spread is not already well below its 60-day mean
  max_holding_trading_days: 20       # the horizon of every idea
  min_review_score: 7                # a second Opus pass scores each idea 1-10; below this it is never pitched
  review_rounds: 3                   # if fewer than 3 clear review, ask for new candidates up to this many times
  no_repeat_days: 21                 # a stock pitched in the last 21 days (or in an open idea) is not pitched again
  label: "Idea for research, not advice"
  comps:
    peers_per_idea: [3, 4]          # plus both legs; same subsector, from watch lists
    metrics: [market_cap, ev, ev_sales_ltm, ev_ebitda_ltm, pe_ltm, pe_fwd, consensus_eps_fwd,
              revenue_growth_ltm, ebitda_margin, roic, net_debt_ebitda, return_1m, return_ytd, next_earnings]
    sources:
      fundamentals: roic_ai          # free plan, worldwide, 5 requests/min
      forward_estimates: yfinance    # Yahoo consensus; unofficial, flagged in the table
      us_cross_check: finnhub
      prices: [stooq, yfinance]
    show_peer_median: true
    show_premium_discount_vs_median: true
    cache_fundamentals_until_next_report: true

earnings:
  full_reviews_per_day: 5
  also_review_if_move_pct: 7.0       # any large company outside the watch lists
  reaction_vs_history_quarters: 8
  transcript_sources: [roic_ai, alpha_vantage, webcast_audio_whisper]
  compare_with_previous_call: true

budget:
  target_words: [1500, 2200]   # about 7–10 minutes, plus the reading pages
  words_per_section:
    core_sector: 70            # the two or three lines per core sector in the briefing
    deep_dive: 600             # Tuesday to Friday, on the previous day's busiest Elsewhere sector

thresholds:
  elsewhere_sector_move_pct: 2.0
  elsewhere_single_stock_move_pct: 7.0
  earnings_surprise_pct: 5.0          # actual vs consensus EPS
  consensus_window_trading_days: 10
  crowded_consensus_share: 0.75
  crowded_min_speakers: 5
  narrative_cracking_drop: 0.20       # fall in consensus share within a week
  priority_voice_weight: 2.0
  story_dedupe_days: 3
  price_source_disagreement_pct: 0.5

# ── Market overview ──────────────────────────────────────────────────
# Canonical tickers are Yahoo-style; the Stooq equivalents are mapped in code.
markets:
  indices:
    - {name: "S&P 500", ticker: "^GSPC", region: US}
    - {name: "Nasdaq 100", ticker: "^NDX", region: US}
    - {name: "FTSE 100", ticker: "^FTSE", region: UK}
    - {name: "FTSE 250", ticker: "^FTMC", region: UK, verify: true}
    - {name: "Euro Stoxx 50", ticker: "^STOXX50E", region: Europe}
    - {name: "DAX", ticker: "^GDAXI", region: Europe}
    - {name: "Nikkei 225", ticker: "^N225", region: Asia}
    - {name: "Hang Seng", ticker: "^HSI", region: Asia}
    - {name: "CSI 300", ticker: "000300.SS", region: Asia, verify: true}
    - {name: "KOSPI", ticker: "^KS11", region: Asia}
    - {name: "VIX", ticker: "^VIX", region: US}
  rates:
    - {name: "UST 2y", source: fred, series: DGS2}
    - {name: "UST 10y", source: fred, series: DGS10}
    - {name: "Gilt 10y", source: boe, series: null, verify: true}
    - {name: "Bund 10y", source: bundesbank, series: null, verify: true}
  commodities:
    - {name: "Brent", ticker: "BZ=F"}
    - {name: "WTI", ticker: "CL=F"}
    - {name: "Gold", ticker: "GC=F"}
    - {name: "Copper", ticker: "HG=F"}
    - {name: "TTF gas", ticker: "TTF=F", verify: true}
  macro_sources:
    - {name: FRED, kind: api, key_env: FRED_API_KEY}
    - {name: ECB Data Portal, kind: api}
    - {name: ONS, kind: api}
    - {name: Bank of England Database, kind: api}
  central_banks: [Fed, ECB, BoE, BoJ, PBoC]
  # Meeting dates are entered once a year from each central bank's calendar.
  meeting_dates: {}

# ── Sectors ──────────────────────────────────────────────────────────
# order = order in the briefing. core: true = full section every day.
# Set core: false to move a sector to "Elsewhere"; add a new block to cover a
# new sector.
sectors:
  - id: tmt
    name: "TMT"
    core: true
    order: 1
    subsectors: ["Semis and AI infrastructure", "Internet platforms", "Advertising and media"]
    proxies:
      - {ticker: SMH, name: "US semis"}
      - {ticker: XLK, name: "US tech"}
      - {ticker: XLC, name: "US communication services"}
      - {ticker: EXV3.DE, name: "STOXX Europe 600 Technology", verify: true}
    watchlist: [NVDA, AVGO, AMD, TSM, ASML, MU, MSFT, GOOGL, META, AMZN, ORCL, CRWV, PUB.PA, WPP.L]
    keywords: [GPU, hyperscaler, capex, data centre, HBM, advertising, CPM]
    debates: [ai-capex-roi, ai-depreciation, ad-market-cycle]

  - id: autos
    name: "Autos and mobility"
    core: true
    order: 2
    subsectors: ["OEMs", "EVs", "Suppliers", "Leasing"]
    proxies:
      - {ticker: CARZ, name: "Global autos ETF", verify: true}
      - {ticker: EXV5.DE, name: "STOXX Europe 600 Automobiles & Parts", verify: true}
    watchlist: [TSLA, "1211.HK", "7203.T", VOW3.DE, BMW.DE, MBG.DE, STLAM.MI, RNO.PA, CON.DE, AYV.PA, ALLY, CVNA]
    keywords: [EV, registrations, residual values, tariffs, autonomy, price war]
    debates: [eu-ev-adoption, china-ev-price-war, tesla-valuation, used-car-residuals]

  - id: staples_retail
    name: "UK/European consumer staples and retail"
    core: true
    order: 3
    subsectors: ["Grocers", "Staples", "Discretionary retail"]
    proxies:
      - {ticker: EXH3.DE, name: "STOXX Europe 600 Food & Beverage", verify: true}
      - {ticker: null, name: "STOXX Europe 600 Retail", verify: true}
    watchlist: [TSCO.L, SBRY.L, MKS.L, OCDO.L, NXT.L, ABF.L, AD.AS, CA.PA, ULVR.L, NESN.SW, DGE.L, ITX.MC]
    keywords: [market share, Kantar, discounters, private label, GLP-1, like-for-like]
    debates: [glp1-staples, uk-grocery-price-war, discounter-share-gains]

  - id: financials
    name: "Financials"
    core: true
    order: 4
    subsectors: ["Banks", "Credit", "Private credit"]
    proxies:
      - {ticker: KBE, name: "US banks"}
      - {ticker: KRE, name: "US regional banks"}
      - {ticker: EXV1.DE, name: "STOXX Europe 600 Banks", verify: true}
      - {ticker: HYG, name: "US high yield"}
    watchlist: [JPM, GS, MS, BAC, HSBA.L, BARC.L, LLOY.L, NWG.L, BNP.PA, SAN.MC, UBSG.SW, DBK.DE, APO, BX, KKR, ARES, OWL]
    keywords: [net interest margin, credit losses, private credit, defaults, BDC, spreads]
    debates: [private-credit-defaults, bank-nim-path, boe-cut-path]

  # Watched for "Elsewhere" only (core: false). Promote any of these by
  # setting core: true and adding watchlist/keywords/debates.
  - {id: energy, name: "Energy", core: false, proxies: [{ticker: XLE}, {ticker: EXH1.DE, verify: true}]}
  - {id: healthcare, name: "Healthcare", core: false, proxies: [{ticker: XLV}, {ticker: EXV4.DE, verify: true}]}
  - {id: industrials, name: "Industrials and defence", core: false, proxies: [{ticker: XLI}, {ticker: ITA}]}
  - {id: materials, name: "Materials and mining", core: false, proxies: [{ticker: XLB}, {ticker: EXV6.DE, verify: true}]}
  - {id: utilities, name: "Utilities", core: false, proxies: [{ticker: XLU}]}
  - {id: real_estate, name: "Real estate", core: false, proxies: [{ticker: XLRE}]}

# ── Live debates ─────────────────────────────────────────────────────
# Claims are tagged against these keys. New keys proposed by the model are
# held for approval in Notion before they count.
debates:
  ai-capex-roi: "Will AI revenue justify hyperscaler and neocloud capex?"
  ai-depreciation: "Are GPU and server useful lives overstated?"
  ad-market-cycle: "Is digital ad growth peaking?"
  eu-ev-adoption: "Will European EV adoption hit targets without subsidies?"
  china-ev-price-war: "Does the China EV price war end in consolidation or exports?"
  tesla-valuation: "Autonomy and robotics optionality vs auto fundamentals"
  used-car-residuals: "Are used-car prices and lease residuals rolling over?"
  glp1-staples: "Do GLP-1 drugs permanently cut volumes for snacks and drinks?"
  uk-grocery-price-war: "Is a UK grocery price war starting?"
  discounter-share-gains: "Do Aldi and Lidl keep taking share?"
  private-credit-defaults: "Are private credit losses being hidden by marks and PIK?"
  bank-nim-path: "Have bank net interest margins peaked?"
  boe-cut-path: "How fast does the BoE cut?"

# ── People (priority voices and the wider pool) ─────────────────────
# Each person can have several channels. Every channel feeds the same person.
