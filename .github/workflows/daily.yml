# The daily briefing, run on GitHub's machines (free on a public repo).
# Keys live in Settings > Secrets and variables > Actions. To pause it, set the repository
# variable PAUSE_BRIEFING to "true". GitHub's scheduler can start runs late at busy times.
name: daily briefing
on:
  schedule:
    # GitHub cron is UTC and only "best effort": at busy times GitHub starts runs hours late or
    # drops them. So there are several start slots between about 05:15 and 08:45 London time
    # (GMT or BST); the first one GitHub actually starts does the briefing, and every later
    # start sees today's briefing is already out and stops within a minute.
    - cron: "17,47 4-7 * * 1-5"
  # Optional: an outside timer (e.g. cron-job.org) can also start it at exactly 05:05 London.
  workflow_dispatch:
    inputs:
      wait:
        description: "Wait until 06:10 London before writing (the outside timer sets this)"
        type: boolean
        default: false
      rerun:
        description: "Run again even if today's briefing is already out"
        type: boolean
        default: false
concurrency: {group: briefing, cancel-in-progress: false}
jobs:
  brief:
    if: vars.PAUSE_BRIEFING != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Newsletter inbox (optional): a Gmail address that Substacks and other newsletters are sent to
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}
      MU_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - name: Only run between 05:00 and 15:00 London time
        id: guard
        run: |
          hour=$(TZ=Europe/London date +%-H)
          echo "London time $(TZ=Europe/London date +%H:%M), event $GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { [ "$hour" -ge 5 ] && [ "$hour" -lt 15 ]; }; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go
        with: {python-version: "3.12", cache: pip}
      - name: Restore database
        if: steps.guard.outputs.go
        uses: actions/cache/restore@v4
        with:
          path: data
          key: mu-data-${{ github.run_id }}
          restore-keys: mu-data-
      - if: steps.guard.outputs.go
        run: |
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Skip if today's briefing is already out
        id: check
        if: steps.guard.outputs.go && !inputs.rerun
        run: |
          if python -m market_updater published-today; then echo "done=1" >> "$GITHUB_OUTPUT"; fi
      - name: Collect
        if: steps.guard.outputs.go && !steps.check.outputs.done
        run: python -m market_updater collect --force
      - name: Wait for the 06:10 snapshot
        if: steps.guard.outputs.go && !steps.check.outputs.done && (github.event_name == 'schedule' || inputs.wait)
        run: |
          now=$(date +%s); target=$(TZ=Europe/London date -d "06:10" +%s)
          if [ "$target" -gt "$now" ]; then sleep $((target - now)); fi
      - name: Write and publish
        if: steps.guard.outputs.go && !steps.check.outputs.done
        run: python -m market_updater run --force
      - name: Show today's briefing on the run page
        if: always() && steps.guard.outputs.go
        run: |
          f=$(ls -t data/out/*.md 2>/dev/null | head -1)
          if [ -n "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo "----- $f -----"; cat "$f"; fi
      - name: Keep today's briefing as a downloadable file (also when Notion fails)
        if: always() && steps.guard.outputs.go
        uses: actions/upload-artifact@v4
        with:
          name: briefing
          path: data/out/
          if-no-files-found: ignore
          retention-days: 30
      - name: Save database
        if: always() && steps.guard.outputs.go
        uses: actions/cache/save@v4
        with:
          path: data
          key: mu-data-${{ github.run_id }}
